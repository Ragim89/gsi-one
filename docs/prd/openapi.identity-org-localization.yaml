openapi: 3.1.0
info:
  title: GSI ONE Block 02 API Fragment
  version: 0.2.0
  description: Identity, authorization, organization and localization contract for Block 02.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Access Administration
  - name: Organization
  - name: Localization
paths:
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      responses:
        '200':
          description: Current user effective access projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /me/permissions:
    get:
      tags: [Identity]
      operationId: getMyPermissions
      responses:
        '200':
          description: Effective permission codes
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    uniqueItems: true
                    items: { type: string }
  /users:
    get:
      tags: [Access Administration]
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /users/{id}:
    get:
      tags: [Access Administration]
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: User }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Access Administration]
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string, minLength: 1 }
                status: { $ref: '#/components/schemas/UserStatus' }
      responses:
        '200': { description: Updated }
        '412': { $ref: '#/components/responses/Problem' }
  /users/{id}/role-assignments:
    post:
      tags: [Access Administration]
      operationId: assignUserRole
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleAssignment'
      responses:
        '201': { description: Role assigned }
  /users/{id}/role-assignments/{assignmentId}/revoke:
    post:
      tags: [Access Administration]
      operationId: revokeUserRoleAssignment
      parameters:
        - $ref: '#/components/parameters/Id'
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
      responses:
        '200': { description: Assignment revoked }
  /roles:
    get:
      tags: [Access Administration]
      operationId: listRoles
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Access Administration]
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRole'
      responses:
        '201': { description: Role created }
  /permissions:
    get:
      tags: [Access Administration]
      operationId: listPermissions
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /organizations:
    get:
      tags: [Organization]
      operationId: listOrganizations
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /organizations/{id}:
    get:
      tags: [Organization]
      operationId: getOrganization
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Organization }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Organization]
      operationId: updateOrganization
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Updated }
        '412': { $ref: '#/components/responses/Problem' }
  /legal-entities:
    get:
      tags: [Organization]
      operationId: listLegalEntities
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Organization]
      operationId: createLegalEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLegalEntity'
      responses:
        '201': { description: Created }
  /legal-entities/{id}:
    get:
      tags: [Organization]
      operationId: getLegalEntity
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Legal entity }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Organization]
      operationId: updateLegalEntity
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Updated }
        '412': { $ref: '#/components/responses/Problem' }
  /branches:
    get:
      tags: [Organization]
      operationId: listBranches
      parameters:
        - in: query
          name: legalEntityId
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Organization]
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranch'
      responses:
        '201': { description: Created }
  /branches/{id}:
    get:
      tags: [Organization]
      operationId: getBranch
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Branch }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Organization]
      operationId: updateBranch
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Updated }
        '412': { $ref: '#/components/responses/Problem' }
  /branches/{id}/languages:
    get:
      tags: [Localization]
      operationId: getBranchLanguages
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Branch language policy
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BranchLanguage' }
    put:
      tags: [Localization]
      operationId: replaceBranchLanguages
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/BranchLanguage' }
      responses:
        '200': { description: Updated }
        '422': { $ref: '#/components/responses/Problem' }
  /locations:
    get:
      tags: [Organization]
      operationId: listLocations
      parameters:
        - in: query
          name: branchId
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Organization]
      operationId: createLocation
      responses:
        '201': { description: Created }
  /localization-profiles:
    get:
      tags: [Localization]
      operationId: listLocalizationProfiles
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Localization]
      operationId: createLocalizationProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLocalizationProfile' }
      responses:
        '201': { description: Created }
  /languages:
    get:
      tags: [Localization]
      operationId: listLanguages
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /currencies:
    get:
      tags: [Localization]
      operationId: listCurrencies
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /number-sequences:
    get:
      tags: [Organization]
      operationId: listNumberSequences
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Organization]
      operationId: createNumberSequence
      responses:
        '201': { description: Created }
  /number-sequences/{id}/preview:
    post:
      tags: [Organization]
      operationId: previewNumberSequence
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Non-reserving preview
          content:
            application/json:
              schema:
                type: object
                required: [preview]
                properties:
                  preview: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: { type: string }
  responses:
    ListResponse:
      description: Authorized list response
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: {}
              nextCursor:
                type: [string, 'null']
    Problem:
      description: RFC 7807-style problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        requestId: { type: string }
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, INVITED, DISABLED]
    Scope:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [GROUP, COUNTRY, LEGAL_ENTITY, BRANCH, LABORATORY, JOB_ASSIGNMENT_ONLY, COUNTERPARTY]
        value:
          type: [string, 'null']
    Me:
      type: object
      required: [id, displayName, status, permissions, scopes, selectableContext]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        preferredLanguage: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
        employee:
          type: [object, 'null']
          additionalProperties: true
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        selectableContext:
          type: object
          required: [legalEntities, branches]
          properties:
            legalEntities:
              type: array
              items: { type: object, additionalProperties: true }
            branches:
              type: array
              items: { type: object, additionalProperties: true }
    CreateRole:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        name: { type: string, minLength: 1 }
        description: { type: string }
        permissionCodes:
          type: array
          uniqueItems: true
          items: { type: string }
    CreateRoleAssignment:
      type: object
      additionalProperties: false
      required: [roleId, scopes]
      properties:
        roleId: { type: string, format: uuid }
        validFrom: { type: string, format: date-time }
        validTo: { type: [string, 'null'], format: date-time }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Scope' }
    CreateLegalEntity:
      type: object
      additionalProperties: false
      required: [organizationId, code, legalName, countryCode, baseCurrency]
      properties:
        organizationId: { type: string, format: uuid }
        code: { type: string, minLength: 1 }
        legalName: { type: string, minLength: 1 }
        tradingName: { type: string }
        countryCode: { type: string, minLength: 2, maxLength: 2 }
        registrationNumber: { type: string }
        taxIdentifiers: { type: object, additionalProperties: { type: string } }
        registeredAddress: { type: object, additionalProperties: true }
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        localizationProfileId: { type: [string, 'null'], format: uuid }
        defaultLanguage: { type: [string, 'null'] }
        effectiveFrom: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    CreateBranch:
      type: object
      additionalProperties: false
      required: [legalEntityId, code, name, countryCode, timezone]
      properties:
        legalEntityId: { type: string, format: uuid }
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        countryCode: { type: string, minLength: 2, maxLength: 2 }
        city: { type: string }
        timezone: { type: string, minLength: 1 }
        localizationProfileId: { type: [string, 'null'], format: uuid }
        costCenterCode: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        effectiveFrom: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    BranchLanguage:
      type: object
      additionalProperties: false
      required: [languageCode, uiEnabled, documentEnabled, default, displayOrder]
      properties:
        languageCode: { type: string }
        uiEnabled: { type: boolean }
        documentEnabled: { type: boolean }
        default: { type: boolean }
        displayOrder: { type: integer, minimum: 0, maximum: 32767 }
    CreateLocalizationProfile:
      type: object
      additionalProperties: false
      required: [name, locale, timezone]
      properties:
        name: { type: string, minLength: 1 }
        locale: { type: string, minLength: 2 }
        timezone: { type: string, minLength: 1 }
        dateFormat: { type: string, default: yyyy-MM-dd }
        timeFormat: { type: string, default: 'HH:mm' }
        numberFormat: { type: [string, 'null'] }
        firstDayOfWeek: { type: integer, minimum: 0, maximum: 6, default: 1 }
